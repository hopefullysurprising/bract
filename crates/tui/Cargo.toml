[package]
name = "bract"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/hopefullysurprising/bract"
description = "A TUI that turns your CLI toolchain into a guided, browsable command palette."
readme = "../../README.md"

[dependencies]
clap = { workspace = true }
dirs = "6"
goblin = "0.10"
helptext-parser = { path = "../helptext-parser" }
ratatui = "0.30.0"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-tree-widget = "0.24.0"

[dev-dependencies]
criterion = "0.5"
helptext-parser = { path = "../helptext-parser" }
insta = "1.43"
tempfile = "3"

[[bench]]
name = "cached_load"
harness = false
