[package]
name = "bract"
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/hopefullysurprising/bract"
description = "A TUI that turns your CLI toolchain into a guided, browsable command palette."
readme = "../../README.md"

[dependencies]
clap = { workspace = true }
dirs = "7"
goblin = "0.10"
helptext-parser = { path = "../helptext-parser" }
ratatui = "0.30.0"
redb = "4"
# Only to upgrade form memory written by bract 0.6.1 and earlier.
redb2 = { package = "redb", version = "2.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-tree-widget = "0.24.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
helptext-parser = { path = "../helptext-parser" }
insta = "1.43"
tempfile = "3"

[[bench]]
name = "cached_load"
harness = false
