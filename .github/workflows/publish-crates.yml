name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish helptext-parser, then bract
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in helptext-parser bract; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "bract-release (github.com/hopefullysurprising/bract)" "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish -p "$crate" --locked
          done
